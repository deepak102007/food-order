<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 48px 40px;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            color: #718096;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: inherit;
            color: #2d3748;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #a0aec0;
        }

        .error-message {
            font-size: 13px;
            color: #e53e3e;
            margin-top: 6px;
            display: none;
        }

        input.error {
            border-color: #e53e3e;
        }

        input.error:focus {
            box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-reset:hover {
            background: #cbd5e0;
        }

        .success-message {
            background: #f0fff4;
            border: 2px solid #9ae6b4;
            color: #22543d;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
            font-size: 15px;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #e2e8f0;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-submit.loading {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-submit.loading .loading-spinner {
            display: inline-block;
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn-submit, .btn-reset {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Get in Touch</h1>
            <p>Send us your information and we'll get back to you shortly</p>
        </div>

        <div class="success-message" id="successMessage">
            ✓ Thank you! Your information has been submitted successfully.
        </div>

        <form id="contactForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="John Doe"
                    required
                >
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="john@example.com"
                    required
                >
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="+1 (555) 123-4567"
                    required
                >
                <div class="error-message" id="phoneError"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="loading-spinner"></span>
                    <span id="submitText">Send Message</span>
                </button>
                <button type="reset" class="btn-reset">Clear</button>
            </div>
        </form>
    </div>

    <script>
        // Google Apps Script deployment URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbYFL-AzpqVSPoVMfbnrX5OFYLGKMUgrdYBwmibLonJOzAV4ZDDEUCMDAR5mGgeK-_/exec';

        function validateForm() {
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            
            let isValid = true;

            // Clear previous errors
            document.getElementById('nameError').style.display = 'none';
            document.getElementById('emailError').style.display = 'none';
            document.getElementById('phoneError').style.display = 'none';
            
            name.classList.remove('error');
            email.classList.remove('error');
            phone.classList.remove('error');

            // Validate name
            if (!name.value.trim()) {
                showError('nameError', 'Name is required');
                name.classList.add('error');
                isValid = false;
            }

            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.value.trim()) {
                showError('emailError', 'Email is required');
                email.classList.add('error');
                isValid = false;
            } else if (!emailRegex.test(email.value)) {
                showError('emailError', 'Please enter a valid email');
                email.classList.add('error');
                isValid = false;
            }

            // Validate phone
            if (!phone.value.trim()) {
                showError('phoneError', 'Phone number is required');
                phone.classList.add('error');
                isValid = false;
            } else if (phone.value.trim().length < 10) {
                showError('phoneError', 'Please enter a valid phone number');
                phone.classList.add('error');
                isValid = false;
            }

            return isValid;
        }

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        async function handleSubmit(event) {
            event.preventDefault();

            if (!validateForm()) {
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const form = document.getElementById('contactForm');
            const successMessage = document.getElementById('successMessage');

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitText.textContent = 'Sending...';
            successMessage.classList.remove('show');

            try {
                const formData = new FormData(form);
                const params = new URLSearchParams();
                
                params.append('name', formData.get('name'));
                params.append('email', formData.get('email'));
                params.append('phone', formData.get('phone'));

                const response = await fetch(APPS_SCRIPT_URL + '?' + params.toString(), {
                    method: 'GET',
                    mode: 'no-cors'
                });

                // Show success message
                successMessage.classList.add('show');
                
                // Reset form
                form.reset();
                
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // Reset button after 3 seconds
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                    submitText.textContent = 'Send Message';
                }, 3000);

            } catch (error) {
                console.error('Error submitting form:', error);
                alert('There was an error submitting your form. Please try again.');
                
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitText.textContent = 'Send Message';
            }
        }

        // Clear error messages on input
        ['name', 'email', 'phone'].forEach(fieldId => {
            document.getElementById(fieldId).addEventListener('input', function() {
                this.classList.remove('error');
                const errorId = fieldId + 'Error';
                document.getElementById(errorId).style.display = 'none';
            });
        });
    </script>
</body>
</html>
